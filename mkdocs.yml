site_name: Specular Differentiation
site_url: https://kyjung2357.github.io/specular-differentiation
repo_url: https://github.com/kyjung2357/specular-differentiation
edit_uri: edit/main/docs/

theme:
  name: material
  logo: figures/specular-differentiation-logo.png
  favicon: figures/specular-differentiation-logo.png
  palette:
    - scheme: default
      primary: custom
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.footer
    - toc.integrate

plugins:
  - search
  - callouts
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 1
  - include-markdown:
      rewrite_relative_urls: true

hooks:
  - docs/hooks/code_copy_buttons.py
  

nav:
  - Home: index.md
  - Getting Started:
    - started/index.md
    - User installation: started/installation.md
    - Quick start: started/quick-start.md
    - Mathematical background: started/mathematical-background.md
    - Simple examples: started/simple-examples.md
  - API Reference:
    - api/index.md
    - Calculation: api/calculation.md
    - ODE: api/ode.md
    - Optimization: api/optimization.md
    - Backend: api/backend.md
  - Examples:
    - examples/index.md
    - Ordinary differential equation:
      - examples/ode/index.md
      - 2026 Jung: examples/ode-2026-jung.md
    - Optimization:
      - examples/optimization/index.md
      - 2026 Jung: examples/optimization-2026-jung.md
      - 2024 Jung-Oh: examples/optimization-2024-jung-oh.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.superfences
  - md_in_html
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/header-home-link.js
  - javascripts/code-copy-buttons.js
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
