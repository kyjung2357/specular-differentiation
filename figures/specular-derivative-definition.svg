<title id="definition-title">Definition of the specular derivative</title>
<desc id="definition-description">The specular derivative of f at x is the tangent of one half of the sum of the arctangents of its right and left derivatives. The derivative symbol consists of a prime and its reflection.</desc>
<style>
  g { fill: #202124; }
  @media (prefers-color-scheme: dark) {
    g { fill: #e6edf3; }
  }
</style>
<!--
Original LaTeX source (compile with latex, then dvisvgm with no fonts and exact bounds):
\documentclass{article}
\usepackage{graphicx}
\pagestyle{empty}
\newcommand{\sd}{\mathord{\prime\mkern-2.5mu\reflectbox{$\scriptstyle\prime$}}}
\begin{document}
\[
f^{\sd}(x)
:=
\tan\left(
  \frac{\arctan\bigl(f'_+(x)\bigr)+\arctan\bigl(f'_-(x)\bigr)}{2}
\right),
\]
\end{document}
-->

