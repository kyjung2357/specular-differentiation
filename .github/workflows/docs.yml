name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.13"

      - name: Export locked documentation dependencies
        run: uv export --locked --extra docs --no-hashes --no-emit-project --output-file "$RUNNER_TEMP/docs-constraints.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c "$RUNNER_TEMP/docs-constraints.txt" -e ".[docs]"

      - name: Validate MkDocs site
        run: mkdocs build --strict --clean

      - name: Deploy MkDocs site
        run: mkdocs gh-deploy --force
