name: Test and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [numpy, numba, jax]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install NumPy test environment
        if: matrix.backend == 'numpy'
        run: python -m pip install -e . pytest

      - name: Install Numba test environment
        if: matrix.backend == 'numba'
        run: python -m pip install -e ".[numba]" pytest "scipy>=1.17"

      - name: Install JAX test environment
        if: matrix.backend == 'jax'
        run: python -m pip install -e ".[jax]" pytest

      - name: Run tests
        run: python -m pytest -W error -p no:cacheprovider

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Install and import the wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -I - <<'PY'
          import math
          from importlib import metadata
          from pathlib import Path

          import specular

          installed_package = Path(
              metadata.distribution("specular-differentiation").locate_file("specular")
          ).resolve()
          imported_package = Path(specular.__file__).resolve().parent
          assert imported_package == installed_package
          assert not imported_package.is_relative_to(Path.cwd().resolve())
          assert specular.__version__ == "1.3.1"
          assert math.isclose(
              specular.derivative(lambda x: max(x, 0.0), 0.0), math.sqrt(2.0) - 1.0
          )
          result = specular.ellipse_scheme(
              lambda t, u: 2.0, 0.0, 1.0, 1.0, n_steps=4, sigma_n=1.0
          )
          assert result.t[-1] == 1.0
          assert result.u[-1] == 3.0
          result = specular.specular_gradient(
              lambda x: x * x, 2.0, a=1.0, max_iter=3
          )
          assert result.success
          assert result.solution == 0.0
          assert result.iteration == 2
          PY
