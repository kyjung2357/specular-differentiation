name: Test and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [numpy, numba, jax]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install NumPy test environment
        if: matrix.backend == 'numpy'
        run: python -m pip install -e . pytest

      - name: Install Numba test environment
        if: matrix.backend == 'numba'
        run: python -m pip install -e ".[numba]" pytest

      - name: Install JAX test environment
        if: matrix.backend == 'jax'
        run: python -m pip install -e ".[jax]" pytest

      - name: Run tests
        run: python -m pytest -W error -p no:cacheprovider

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Install and import the wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import specular; assert specular.__version__ == '1.3.0'"
